<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';">
  <title>PubCraft Live Watch</title>
  <script src="/static/marked.min.js"></script>
  <script src="/static/pdf.min.js"></script>
  <style>
    :root {
      --bg: #141312;
      --bar-bg: #1e1d1b;
      --border: #33312c;
      --text: #e6e3dd;
      --muted: #8c887b;
      --accent: #d97736;
      --page-bg: #faf8f5;
      --page-text: #1a1815;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    .book-info {
      font-size: 13px;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 12px;
    }
    .book-info strong {
      color: var(--text);
      font-weight: 600;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 204, 113, 0.12);
      border: 1px solid rgba(46, 204, 113, 0.35);
      color: #2ecc71;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      transition: all .3s ease;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 6px #2ecc71;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select, button {
      background: #2a2825;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      transition: background .15s, border-color .15s;
    }
    select:hover, button:hover {
      background: #36332f;
      border-color: #555;
    }
    button.cta {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.cta:hover {
      background: #e68240;
    }
    .view-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      scroll-behavior: smooth;
    }

    /* Paged Real PDF view */
    .paged-view {
      display: flex;
      flex-direction: column;
      gap: 36px;
      width: 100%;
      max-width: 820px;
      align-items: center;
    }
    .pdf-page-card {
      background: var(--page-bg);
      color: var(--page-text);
      box-shadow: 0 10px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.08);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 680px;
    }
    .pdf-page-header {
      width: 100%;
      background: #22201d;
      color: #9c978b;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      letter-spacing: .03em;
    }
    .pdf-page-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    .pdf-notice {
      background: var(--bar-bg);
      border: 1px solid var(--border);
      padding: 36px 30px;
      border-radius: 8px;
      text-align: center;
      max-width: 520px;
      margin: 40px auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .pdf-notice h3 { margin-bottom: 10px; color: var(--text); font-size: 17px; }
    .pdf-notice p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s infinite linear;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Continuous view */
    .continuous-view {
      background: var(--page-bg);
      color: var(--page-text);
      max-width: 680px;
      width: 100%;
      padding: 50px 60px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      border-radius: 4px;
    }

    /* Typography base inside watch continuous view */
    .rendered-content {
      font-size: 11pt;
      line-height: 1.55;
      text-align: justify;
    }
    .rendered-content h1.book-main-title {
      font-size: 26pt;
      text-align: center;
      margin-top: 1.5in;
      margin-bottom: 0.3em;
    }
    .rendered-content .book-byline {
      text-align: center;
      font-size: 13pt;
      color: #555;
      margin-bottom: 2in;
    }
    .rendered-content .copyright-box {
      font-size: 9pt;
      margin-top: 3.5in;
      line-height: 1.4;
      color: #444;
    }
    .rendered-content .section-break {
      border: none;
      height: 1px;
      background: #ccc;
      margin: 40px 0;
    }
    .rendered-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1.5em auto;
    }
  </style>
  <style id="dynamicStyleCSS"></style>
  <style id="dynamicFontCSS"></style>
  <style id="dynamicSceneBreakCSS"></style>
</head>
<body>
  <header>
    <div class="brand-group">
      <div class="brand">PubCraft <span>Live Watch</span></div>
      <div class="book-info">
        <strong id="bookTitle" data-i18n="loading">Loading…</strong>
        <span id="bookAuthor"></span>
      </div>
      <div class="status-badge" id="statusBadge">
        <div class="pulse-dot"></div>
        <span id="statusText" data-i18n="status_synced">Synchronized</span>
      </div>
    </div>
    <div class="controls">
      <select id="jumpChapter">
        <option value="" data-i18n="jump_to">Jump to…</option>
      </select>
      <select id="viewMode">
        <option value="paged" data-i18n="mode_kdp_pages">📖 KDP Pages (Real PDF)</option>
        <option value="continuous" data-i18n="mode_continuous">📜 Continuous Stream</option>
      </select>
      <button id="btnObsidian" data-i18n="btn_obsidian">Open in Obsidian</button>
      <button id="btnPrint" class="cta" data-i18n="btn_print">Print / Open PDF</button>
    </div>
  </header>

  <div class="view-container" id="scrollContainer">
    <div id="contentTarget" class="paged-view"></div>
  </div>

  <script src="/static/watch.js"></script>
</body>
</html>
